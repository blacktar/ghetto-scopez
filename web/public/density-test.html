<!doctype html><meta charset="utf-8"><title>Scope density coverage diagnostic</title><style>body{background:#111;color:#ddd;font:14px monospace}canvas{max-width:100%;height:auto}pre{white-space:pre-wrap}</style><h1>Uniform bin coverage test</h1><p>Every input bin contains exactly one count. The output must be a flat grey field at every viewport size.</p><pre id="result">Testing…</pre><canvas id="plot"></canvas><a id="png">Lossless PNG</a><script type="module">
import {DENSITY_SHADER} from './density-shader.mjs';
const q=new URLSearchParams(location.search),w=Number(q.get('width')||997),h=Number(q.get('height')||503),mode=Number(q.get('mode')||4),c=document.querySelector('canvas');c.width=w;c.height=h;
const gl=c.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:true});
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,`#version 300 es
precision highp float;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0,1);}`));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;precision highp int;precision highp usampler2D;uniform usampler2D dataTex;uniform int mode;uniform bool twinHorizontal;uniform ivec2 viewportSize;out vec4 color;
${DENSITY_SHADER}
void main(){vec2 uv=gl_FragCoord.xy/vec2(viewportSize);float n=density(dataTex,uv,1./vec2(viewportSize));color=vec4(vec3(n/16.),1);}`));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);
const tw=512,th=mode===4?1024:512,a=new Uint32Array(tw*th).fill(1),tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texImage2D(gl.TEXTURE_2D,0,gl.R32UI,tw,th,0,gl.RED_INTEGER,gl.UNSIGNED_INT,a);gl.uniform1i(gl.getUniformLocation(p,'mode'),mode);gl.uniform1i(gl.getUniformLocation(p,'twinHorizontal'),1);gl.uniform2i(gl.getUniformLocation(p,'viewportSize'),w,h);gl.viewport(0,0,w,h);gl.drawArrays(gl.TRIANGLES,0,3);
const pixels=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let min=255,max=0;const levels=new Set();for(let i=0;i<pixels.length;i+=4){min=Math.min(min,pixels[i]);max=Math.max(max,pixels[i]);levels.add(pixels[i]);}document.querySelector('#result').textContent=JSON.stringify({width:w,height:h,mode,min,max,levels:[...levels].sort((a,b)=>a-b),expected:Math.round(255/16*Math.max((mode===4?th:tw)/w,1)*Math.max((mode===4?tw:th)/h,1)),pass:min===max&&min===Math.round(255/16*Math.max((mode===4?th:tw)/w,1)*Math.max((mode===4?tw:th)/h,1))});const link=document.querySelector('#png');link.href=c.toDataURL('image/png');link.download='uniform-density.png';
</script>
