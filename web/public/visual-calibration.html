<!doctype html><meta charset="utf-8"><title>Screenshot colour calibration</title><style>body{margin:0;background:#000}main{display:grid;grid-template-columns:repeat(24,40px);width:960px}div{height:40px}</style><main></main><script>const levels=[0,9,26,64,128,192,255];for(const r of levels)for(const g of levels)for(const b of levels){const d=document.createElement('div');d.style.background=`rgb(${r},${g},${b})`;d.dataset.rgb=JSON.stringify([r,g,b]);document.querySelector('main').append(d);}</script>
